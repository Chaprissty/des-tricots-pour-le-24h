<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration | DES TRICOTS POUR LE 24H</title><style>body{font:16px/1.6 Arial,sans-serif;background:#faf7f1;color:#28354a;margin:0}main{max-width:900px;margin:35px auto;padding:20px}h1,h2{font-family:Georgia,serif}section,article{background:white;border:1px solid #e8e1d9;border-radius:14px;padding:22px;margin-bottom:18px}label{display:block;font-weight:bold;margin:12px 0 4px}input:not([type=checkbox]),textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aeb9b2;border-radius:8px;font:inherit}button,a.button{background:#28354a;color:white;border:0;border-radius:30px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 5px 6px 0;font:inherit}button.alt{background:#789084}button.danger{background:#a44e4e}.hidden{display:none}img{width:140px;height:140px;object-fit:cover;border-radius:10px}.entry{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.muted{color:#65706b;font-size:14px}.error{color:#a22}</style></head><body><main><a href="/">← Retour au site</a><h1>Gestion des tuques</h1><section id="login"><h2>Connexion</h2><form id="loginForm"><label for="password">Mot de passe administrateur</label><input id="password" type="password" autocomplete="current-password" required><button>Se connecter</button></form><p id="loginError" class="error"></p></section><div id="workspace" class="hidden"><button id="logout" class="alt">Déconnexion</button><section><h2 id="formTitle">Ajouter une tuque</h2><form id="editForm"><input type="hidden" id="editId"><label for="prenom">Prénom</label><input id="prenom" required maxlength="80"><label for="description">Description</label><textarea id="description" rows="3" maxlength="1000"></textarea><label for="photo">Photo (JPG, PNG ou WEBP, max. 3 Mo après compression)</label><input type="file" id="photo" accept="image/jpeg,image/png,image/webp"><label><input id="vendue" type="checkbox"> Tuque vendue (précommande possible)</label><p><button type="submit">Enregistrer sur le site</button><button type="button" class="alt" id="reset">Annuler</button></p></form><p id="status" role="status"></p></section><h2>Mes créations</h2><div id="list"></div><p class="muted">Les changements sont publiés sur le site en ligne. Les demandes de réservation se consultent dans Netlify → Forms.</p></div></main><script>
let items=[];const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api/'+path,{credentials:'same-origin',...options});const data=await r.json();if(!r.ok)throw Error(data.error||'Erreur réseau');return data}
async function refresh(){try{items=(await api('manage')).products;$('login').classList.add('hidden');$('workspace').classList.remove('hidden');draw()}catch(e){$('login').classList.remove('hidden');$('workspace').classList.add('hidden')}}
function draw(){$('list').innerHTML=items.map((p,i)=>`<article class="entry">${p.photo?`<img src="${safe(p.photo)}" alt="${safe(p.prenom)}">`:''}<div><h3>${safe(p.prenom)}</h3><p>${p.vendue?'Vendue':'Disponible'}</p><button data-action="edit" data-i="${i}">Modifier</button><button data-action="sold" data-i="${i}" class="alt">${p.vendue?'Marquer disponible':'Marquer vendue'}</button><button data-action="delete" data-i="${i}" class="danger">Supprimer</button></div></article>`).join('')}
async function save(){const result=await api('manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products:items})});items=result.products;draw();$('status').textContent='Modifications enregistrées sur le site.'}
function clear(){document.getElementById('editForm').reset();$('editId').value='';$('formTitle').textContent='Ajouter une tuque'}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';$('loginError').textContent='';await refresh()}catch(err){$('loginError').textContent=err.message}};
$('logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};$('reset').onclick=clear;
$('list').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const i=Number(b.dataset.i),a=b.dataset.action;if(a==='edit'){$('editId').value=i;$('prenom').value=items[i].prenom;$('description').value=items[i].description;$('vendue').checked=items[i].vendue;$('formTitle').textContent='Modifier '+items[i].prenom;window.scrollTo(0,0);return}if(a==='delete'&&!confirm('Supprimer cette tuque?'))return;const old=structuredClone(items);if(a==='delete')items.splice(i,1);else items[i].vendue=!items[i].vendue;try{await save()}catch(err){items=old;draw();alert(err.message)}};
function photoData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{const factor=Math.min(1,1200/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*factor);canvas.height=Math.round(image.height*factor);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.78))};image.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Photo illisible'))};image.src=url})}
$('editForm').onsubmit=async e=>{e.preventDefault();const old=structuredClone(items);try{const id=$('editId').value;const image=await photoData($('photo').files[0]);const item={id:id===''?crypto.randomUUID():items[Number(id)].id,prenom:$('prenom').value.trim(),description:$('description').value.trim(),photo:image||(id===''?'':items[Number(id)].photo),vendue:$('vendue').checked};if(!item.prenom)return;if(id==='')items.push(item);else items[Number(id)]=item;$('status').textContent='Enregistrement en cours…';await save();clear()}catch(err){items=old;$('status').textContent='Erreur : '+err.message}};
refresh();
</script></body></html>
